<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Maze Chase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }
  #gameCanvas {
    border: 2px solid #2121DE;
    image-rendering: pixelated;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 560px;
    padding: 8px 0;
    font-size: 16px;
  }
  #hud span { color: #FFD700; }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    color: #FFD700;
    text-align: center;
    display: none;
    text-shadow: 0 0 10px #FFD700;
    z-index: 10;
  }
  #message button {
    margin-top: 15px;
    padding: 8px 24px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    background: #2121DE;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  #message button:hover { background: #4040FF; }
</style>
</head>
<body>
<div id="hud">
  <span>SCORE: <span id="score">0</span></span>
  <span>LIVES: <span id="lives">♥♥♥</span></span>
</div>
<canvas id="gameCanvas"></canvas>
<div id="message"></div>
<script src="src/game.js"></script>
</body>
</html>
