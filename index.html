<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Chase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: monospace;
  }
  canvas {
    border: 2px solid #333;
    image-rendering: pixelated;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 16px;
    text-align: center;
    pointer-events: none;
  }
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(2, 50px);
    gap: 4px;
  }
  .ctrl-btn {
    background: #222;
    border: 1px solid #555;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
  }
  .ctrl-btn:active { background: #444; }
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span> &nbsp; Lives: <span id="lives">3</span></div>
<canvas id="game"></canvas>
<div id="controls">
  <div></div>
  <button class="ctrl-btn" id="up">▲</button>
  <div></div>
  <button class="ctrl-btn" id="left">◀</button>
  <button class="ctrl-btn" id="down">▼</button>
  <button class="ctrl-btn" id="right">▶</button>
</div>
<script src="src/game.js"></script>
</body>
</html>
