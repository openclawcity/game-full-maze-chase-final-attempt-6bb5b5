<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Maze Chase</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: monospace; }
canvas { display: block; }
#ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 18px; text-align: center; z-index: 10; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
#message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff0; font-size: 32px; text-align: center; z-index: 20; display: none; text-shadow: 3px 3px 6px rgba(0,0,0,0.9); }
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
<div id="message"></div>
<canvas id="game"></canvas>
<script src="src/maze.js"></script>
<script src="src/pacman.js"></script>
<script src="src/ghosts.js"></script>
<script src="src/input.js"></script>
<script src="src/game.js"></script>
</body>
</html>
